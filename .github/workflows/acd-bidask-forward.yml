name: ACD BID ASK Forward

on:
  push:
    branches:
      - research/acd-execution-quick
    paths:
      - 'research/download_xauusd_bidask.js'
      - 'research/acd_bidask_from_csv.py'
      - 'research/acd_bidask_from_csv_v2.py'
      - '.github/workflows/acd-bidask-forward.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'research/download_xauusd_bidask.js'
      - 'research/acd_bidask_from_csv.py'
      - 'research/acd_bidask_from_csv_v2.py'
      - '.github/workflows/acd-bidask-forward.yml'
  workflow_dispatch:

concurrency:
  group: acd-bidask-forward
  cancel-in-progress: true

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: research/requirements-acd-quick.txt
      - name: Install Node downloader
        run: npm install --no-save dukascopy-node
      - name: Install Python dependencies
        run: pip install -r research/requirements-acd-quick.txt
      - name: Download XAUUSD BID and ASK M1
        run: node research/download_xauusd_bidask.js
      - name: Run true BID ASK forward test
        shell: bash
        run: |
          mkdir -p artifacts_bidask
          set -o pipefail
          python research/acd_bidask_from_csv_v2.py 2>&1 | tee artifacts_bidask/run.log
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: acd-bidask-forward-results
          path: artifacts_bidask/
          if-no-files-found: warn
          retention-days: 14
