name: XAU Donchian Long History

on:
  push:
    branches:
      - research/xau-donchian-long-history
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: xau-donchian-long-history
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: research/requirements-xau-long.txt
      - name: Install downloader
        run: npm install --no-save dukascopy-node
      - name: Install Python dependencies
        run: pip install -r research/requirements-xau-long.txt
      - name: Download XAUUSD BID and ASK H4
        run: node research/download_xauusd_h4_long.js
      - name: Run fixed-parameter long-history validation
        shell: bash
        run: |
          mkdir -p artifacts_xau_long
          set -o pipefail
          python research/xau_donchian_long_history.py 2>&1 | tee artifacts_xau_long/run.log
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xau-donchian-long-history-results
          path: artifacts_xau_long/
          if-no-files-found: warn
          retention-days: 14
