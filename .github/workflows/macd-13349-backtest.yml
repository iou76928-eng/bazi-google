name: MACD 13 34 9 Backtest

on:
  push:
    branches:
      - research/macd-13349-backtest
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: macd-13349-backtest
  cancel-in-progress: true

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: research/requirements-macd-backtest.txt
      - name: Install downloader
        run: npm install --no-save dukascopy-node
      - name: Install Python dependencies
        run: pip install -r research/requirements-macd-backtest.txt
      - name: Download XAUUSD BID and ASK M1
        run: node research/download_xauusd_bidask_macd.js
      - name: Run MACD divergence backtest
        shell: bash
        run: |
          mkdir -p artifacts_macd
          set -o pipefail
          python research/macd_divergence_backtest_v2.py 2>&1 | tee artifacts_macd/run.log
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macd-13349-backtest-results
          path: artifacts_macd/
          if-no-files-found: warn
          retention-days: 14
