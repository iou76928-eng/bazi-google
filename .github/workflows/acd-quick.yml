name: Corrected ACD Quick

on:
  push:
    branches:
      - research/acd-execution-quick
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: corrected-acd-quick
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: research/requirements-acd-quick.txt
      - name: Install dependencies
        run: pip install -r research/requirements-acd-quick.txt
      - name: Run corrected ACD test
        run: python research/acd_quick_standalone.py
      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: corrected-acd-quick-results
          path: artifacts_execution_quick/
          if-no-files-found: error
          retention-days: 14
