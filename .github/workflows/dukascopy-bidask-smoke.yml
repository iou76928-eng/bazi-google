name: Dukascopy BID ASK Smoke

on:
  push:
    branches:
      - research/acd-execution-quick
    paths:
      - 'research/dukascopy_bidask_smoke.py'
      - 'research/acd_bidask_forward.py'
      - '.github/workflows/dukascopy-bidask-smoke.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'research/dukascopy_bidask_smoke.py'
      - 'research/acd_bidask_forward.py'
      - '.github/workflows/dukascopy-bidask-smoke.yml'
  workflow_dispatch:

concurrency:
  group: dukascopy-bidask-smoke
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: research/requirements-acd-quick.txt
      - name: Install dependencies
        run: pip install -r research/requirements-acd-quick.txt
      - name: Run smoke test
        run: python research/dukascopy_bidask_smoke.py
